<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f8fb" />
    <script>
      // Resolve the saved theme before first paint (light unless the user chose
      // otherwise). Mirrors useApplyPreferences in src/stores/preferences.ts.
      try {
        var t = JSON.parse(localStorage.getItem("hueful.preferences") || "{}").state?.theme || "light";
        if (t === "system") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = t;
        if (t === "dark") document.querySelector('meta[name="theme-color"]').setAttribute("content", "#0b0f14");
      } catch (e) {
        document.documentElement.dataset.theme = "light";
      }
    </script>
    <meta
      name="description"
      content="HUEFUL, a color assistant for people with color vision deficiency. Name colors, check ripeness, compare and match colors."
    />
    <title>HUEFUL, color assistant</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
